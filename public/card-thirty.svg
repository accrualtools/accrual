<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="There are three different 30/360 conventions and they disagree">
  <rect width="1600" height="900" fill="#0B0F0E"/>

  <text x="96" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#7B8B87" letter-spacing="3">THERE IS NO SUCH THING AS</text>
  <text x="96" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="92" fill="#D8E0DD">&#8220;30/360&#8221;</text>
  <text x="96" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#7B8B87">there are three of them, and for 2025-02-28 &#8594; 2025-03-31 they disagree</text>

  <!-- Three panels, one per variant, each with the day count it returns. -->
  <g>
    <rect x="96" y="336" width="432" height="336" fill="#111716" stroke="#1E2826" stroke-width="2"/>
    <text x="132" y="392" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" fill="#B8FF3C">30U/360</text>
    <text x="132" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#7B8B87">US / NASD</text>
    <text x="132" y="536" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="86" fill="#D8E0DD">30</text>
    <text x="270" y="536" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#7B8B87">days</text>
    <text x="132" y="596" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#7B8B87">has a last-day-of-February</text>
    <text x="132" y="622" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#7B8B87">rule. pulls Feb 28 to the 30th.</text>
  </g>

  <g>
    <rect x="584" y="336" width="432" height="336" fill="#111716" stroke="#FFB238" stroke-width="2"/>
    <text x="620" y="392" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" fill="#FFB238">30/360</text>
    <text x="620" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#7B8B87">ISDA bond basis</text>
    <text x="620" y="536" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="86" fill="#FFB238">33</text>
    <text x="758" y="536" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#7B8B87">days</text>
    <text x="620" y="596" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#7B8B87">no February rule. counts</text>
    <text x="620" y="622" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#7B8B87">three days that don't exist.</text>
  </g>

  <g>
    <rect x="1072" y="336" width="432" height="336" fill="#111716" stroke="#1E2826" stroke-width="2"/>
    <text x="1108" y="392" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" fill="#B8FF3C">30E/360</text>
    <text x="1108" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#7B8B87">european / ICMA 251</text>
    <text x="1108" y="536" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="86" fill="#D8E0DD">32</text>
    <text x="1246" y="536" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#7B8B87">days</text>
    <text x="1108" y="596" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#7B8B87">clamps both 31sts to 30,</text>
    <text x="1108" y="622" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#7B8B87">unconditionally.</text>
  </g>

  <line x1="96" y1="736" x2="1504" y2="736" stroke="#1E2826" stroke-width="2"/>

  <text x="96" y="792" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#D8E0DD">i had this wrong in my own test suite. the library was right, the test was wrong.</text>
  <text x="96" y="832" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#7B8B87">so i added the third variant instead of adjusting the number.</text>

  <text x="1504" y="832" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#B8FF3C">accrual</text>
</svg>
