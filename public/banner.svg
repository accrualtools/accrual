<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" role="img" aria-label="accrual: six day-count conventions, six different numbers">
  <rect width="1500" height="500" fill="#0B0F0E"/>

  <!-- Faint grid, like a rate sheet. -->
  <g stroke="#151C1B" stroke-width="1">
    <line x1="0" y1="100" x2="1500" y2="100"/>
    <line x1="0" y1="200" x2="1500" y2="200"/>
    <line x1="0" y1="300" x2="1500" y2="300"/>
    <line x1="0" y1="400" x2="1500" y2="400"/>
  </g>

  <!-- Left 420px stays clear: X drops the avatar over this region. -->

  <!-- The point of the whole project: same dates, six answers. -->
  <text x="470" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#7B8B87" letter-spacing="2.4">2025-02-28 &#8594; 2025-03-31</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">
    <text x="470" y="192" fill="#7B8B87">ACT/360</text>
    <text x="700" y="192" fill="#D8E0DD">0.08611111</text>

    <text x="470" y="234" fill="#7B8B87">ACT/365F</text>
    <text x="700" y="234" fill="#D8E0DD">0.08493151</text>

    <text x="470" y="276" fill="#7B8B87">ACT/ACT</text>
    <text x="700" y="276" fill="#D8E0DD">0.08493151</text>

    <text x="470" y="318" fill="#7B8B87">30U/360</text>
    <text x="700" y="318" fill="#D8E0DD">0.08333333</text>

    <text x="470" y="360" fill="#7B8B87">30/360</text>
    <text x="700" y="360" fill="#FFB238">0.09166667</text>

    <text x="470" y="402" fill="#7B8B87">30E/360</text>
    <text x="700" y="402" fill="#D8E0DD">0.08888889</text>
  </g>

  <!-- Bracket spanning the two extremes, with the spread called out. -->
  <g stroke="#FFB238" stroke-width="2" fill="none">
    <path d="M 900 310 L 916 310 L 916 352 L 900 352"/>
  </g>
  <text x="936" y="337" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" fill="#FFB238">10.000% apart</text>

  <line x1="1130" y1="150" x2="1130" y2="400" stroke="#1E2826" stroke-width="2"/>

  <text x="1176" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="42" fill="#D8E0DD" letter-spacing="-0.5">accrual</text>
  <text x="1176" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" fill="#B8FF3C" letter-spacing="1.5">$ACCR</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#7B8B87">
    <text x="1176" y="292">library / CLI / MCP</text>
    <text x="1176" y="320">145 of 145 tests</text>
    <text x="1176" y="348">0 dependencies</text>
  </g>

  <text x="1176" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#B8FF3C">accrual.tools</text>

  <rect x="470" y="446" width="860" height="8" fill="#B8FF3C"/>
</svg>
