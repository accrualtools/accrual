<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="accrual: a rising step curve, final step in amber">
  <rect width="400" height="400" fill="#0B0F0E"/>

  <!-- Baseline stubs: where each bar would sit if nothing accrued. -->
  <g fill="#1E2826">
    <rect x="72" y="288" width="40" height="40"/>
    <rect x="126" y="288" width="40" height="40"/>
    <rect x="180" y="288" width="40" height="40"/>
    <rect x="234" y="288" width="40" height="40"/>
    <rect x="288" y="288" width="40" height="40"/>
  </g>

  <!-- The accrual itself. Four acid steps, growing. -->
  <g fill="#B8FF3C">
    <rect x="72" y="260" width="40" height="28"/>
    <rect x="126" y="220" width="40" height="68"/>
    <rect x="180" y="160" width="40" height="128"/>
    <rect x="234" y="120" width="40" height="168"/>
  </g>

  <!-- Final step in amber: the figure that gets quoted. -->
  <rect x="288" y="64" width="40" height="224" fill="#FFB238"/>

  <rect x="72" y="328" width="256" height="10" fill="#B8FF3C"/>
</svg>
