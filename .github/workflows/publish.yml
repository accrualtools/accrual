# Publishes on a version tag, with provenance.
#
# Provenance is the part that matters here. It makes npm record, in a public
# transparency log, which commit and which workflow produced the tarball. Until
# now a reader could read the source on GitHub and install from npm but had no
# way to prove the two were the same thing. `npm audit signatures` checks it.
#
# Publishing from CI also means the token never sits on a laptop.

name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v0.1.1'
        required: true

permissions:
  contents: read
  id-token: write # required for provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Test before publishing
        run: npm test

      - name: The tag must match the version being published
        # A tag that disagrees with package.json produces a release nobody can
        # trace back, which is the opposite of what provenance is for.
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "publishing v$version"

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
