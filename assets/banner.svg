<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <style>.m { font-family: "DejaVu Sans Mono", monospace; }</style>
  </defs>

  <rect width="1500" height="500" fill="#0B0F0E"/>

  <!-- left block. kept above y=360 and inside x<560 so the profile photo,
       which X overlays on the bottom-left, never covers any of it -->
  <text class="m" x="80" y="196" font-size="66" font-weight="bold" fill="#D8E0DD">accrual</text>
  <text class="m" x="80" y="250" font-size="24" fill="#7B8B87">yield math for tokenized RWAs</text>
  <text class="m" x="80" y="286" font-size="24" fill="#7B8B87">one period, six conventions, six answers</text>

  <rect x="80" y="308" width="132" height="42" rx="21" fill="none" stroke="#B8FF3C" stroke-width="2"/>
  <text class="m" x="146" y="336" font-size="22" fill="#B8FF3C" text-anchor="middle">$ACCR</text>

  <!-- right: the same period priced six ways -->
  <text class="m" x="640" y="124" font-size="22" fill="#7B8B87">Feb 28 to Mar 31, year fraction</text>

  <text class="m" x="640" y="175" font-size="24" fill="#FFB238">30U/360</text>
  <text class="m" x="900" y="175" font-size="24" fill="#FFB238" text-anchor="end">0.08333333</text>

  <text class="m" x="640" y="215" font-size="24" fill="#D8E0DD">ACT/365F</text>
  <text class="m" x="900" y="215" font-size="24" fill="#D8E0DD" text-anchor="end">0.08493151</text>

  <text class="m" x="640" y="255" font-size="24" fill="#D8E0DD">ACT/ACT</text>
  <text class="m" x="900" y="255" font-size="24" fill="#D8E0DD" text-anchor="end">0.08493151</text>

  <text class="m" x="640" y="295" font-size="24" fill="#D8E0DD">ACT/360</text>
  <text class="m" x="900" y="295" font-size="24" fill="#D8E0DD" text-anchor="end">0.08611111</text>

  <text class="m" x="640" y="335" font-size="24" fill="#D8E0DD">30E/360</text>
  <text class="m" x="900" y="335" font-size="24" fill="#D8E0DD" text-anchor="end">0.08888889</text>

  <text class="m" x="640" y="375" font-size="24" fill="#B8FF3C">30/360</text>
  <text class="m" x="900" y="375" font-size="24" fill="#B8FF3C" text-anchor="end">0.09166667</text>

  <!-- bracket spanning smallest to largest -->
  <path d="M 932 167 L 946 167 L 946 375 L 932 375" fill="none" stroke="#FFB238" stroke-width="2"/>
  <text class="m" x="962" y="279" font-size="24" fill="#FFB238">10.000% apart</text>

  <!-- meta, right aligned -->
  <text class="m" x="1420" y="175" font-size="21" fill="#7B8B87" text-anchor="end">library / CLI / MCP</text>
  <text class="m" x="1420" y="211" font-size="21" fill="#7B8B87" text-anchor="end">13 MCP tools</text>
    <text class="m" x="1420" y="247" font-size="21" fill="#7B8B87" text-anchor="end">149 of 149 tests</text>
  <text class="m" x="1420" y="283" font-size="21" fill="#7B8B87" text-anchor="end">0 dependencies</text>
  <text class="m" x="1420" y="375" font-size="22" fill="#B8FF3C" text-anchor="end">accrual.tools</text>

  <line x1="640" y1="424" x2="1420" y2="424" stroke="#B8FF3C" stroke-width="6"/>
</svg>
