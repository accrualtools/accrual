<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <style>
      .m { font-family: "DejaVu Sans Mono", monospace; }
    </style>
  </defs>

  <rect width="1500" height="500" fill="#0B0F0E"/>

  <!-- left block. bottom-left kept clear: the token icon overlaps there -->
  <text class="m" x="70" y="132" font-size="72" font-weight="bold" fill="#D8E0DD">accrual</text>

  <rect x="70" y="158" width="128" height="44" rx="8" fill="none" stroke="#B8FF3C" stroke-width="2"/>
  <text class="m" x="134" y="188" font-size="26" fill="#B8FF3C" text-anchor="middle">ACCR</text>

  <text class="m" x="70" y="256" font-size="24" fill="#7B8B87">yield math for tokenized RWAs</text>
  <text class="m" x="70" y="292" font-size="22" fill="#7B8B87">day count, bills, duration, convexity</text>

  <!-- right panel: the six conventions -->
  <rect x="660" y="36" width="790" height="400" rx="14" fill="#111716" stroke="#1E2826" stroke-width="2"/>

  <text class="m" x="690" y="78" font-size="20" fill="#7B8B87">1,000,000 at 4.25%, Feb 28 to Mar 31</text>
  <line x1="690" y1="96" x2="1420" y2="96" stroke="#1E2826" stroke-width="2"/>

  <text class="m" x="690"  y="136" font-size="25" fill="#FFB238">30U/360</text>
  <text class="m" x="1420" y="136" font-size="25" fill="#FFB238" text-anchor="end">3,541.67</text>

  <text class="m" x="690"  y="178" font-size="25" fill="#D8E0DD">ACT/365F</text>
  <text class="m" x="1420" y="178" font-size="25" fill="#D8E0DD" text-anchor="end">3,609.59</text>

  <text class="m" x="690"  y="220" font-size="25" fill="#D8E0DD">ACT/ACT</text>
  <text class="m" x="1420" y="220" font-size="25" fill="#D8E0DD" text-anchor="end">3,609.59</text>

  <text class="m" x="690"  y="262" font-size="25" fill="#D8E0DD">ACT/360</text>
  <text class="m" x="1420" y="262" font-size="25" fill="#D8E0DD" text-anchor="end">3,659.72</text>

  <text class="m" x="690"  y="304" font-size="25" fill="#D8E0DD">30E/360</text>
  <text class="m" x="1420" y="304" font-size="25" fill="#D8E0DD" text-anchor="end">3,777.78</text>

  <text class="m" x="690"  y="346" font-size="25" fill="#B8FF3C">30/360</text>
  <text class="m" x="1420" y="346" font-size="25" fill="#B8FF3C" text-anchor="end">3,895.83</text>

  <line x1="690" y1="372" x2="1420" y2="372" stroke="#1E2826" stroke-width="2"/>
  <text class="m" x="690"  y="410" font-size="24" fill="#7B8B87">widest disagreement</text>
  <text class="m" x="1420" y="410" font-size="24" fill="#B8FF3C" text-anchor="end">10.000%</text>

  <text class="m" x="1450" y="474" font-size="22" fill="#7B8B87" text-anchor="end">accrual.tools</text>
</svg>
