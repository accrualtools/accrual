<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="The MCP server passed 156 tests and was still dead when installed, because npm installs bins as symlinks">
  <rect width="1600" height="900" fill="#0B0F0E"/>

  <text x="96" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#7B8B87" letter-spacing="3">A BUG NO TEST IN THE REPO COULD SEE</text>

  <text x="96" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="50" fill="#D8E0DD">156 tests green.</text>
  <text x="96" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="50" fill="#FFB238">dead on arrival.</text>

  <line x1="96" y1="314" x2="1504" y2="314" stroke="#1E2826" stroke-width="2"/>

  <!-- The check that looked correct. -->
  <text x="96" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" fill="#7B8B87" letter-spacing="2">THE GUARD, AS WRITTEN</text>
  <text x="96" y="424" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#D8E0DD">import.meta.url === pathToFileURL(process.argv[1]).href</text>

  <!-- What npm actually hands you. -->
  <text x="96" y="504" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" fill="#7B8B87" letter-spacing="2">WHAT NPM ACTUALLY RUNS</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">
    <text x="96" y="556" fill="#7B8B87">argv[1]</text>
    <text x="300" y="556" fill="#FFB238">node_modules/.bin/accrual-mcp</text>
    <text x="1100" y="556" fill="#7B8B87">the symlink</text>

    <text x="96" y="600" fill="#7B8B87">meta.url</text>
    <text x="300" y="600" fill="#B8FF3C">node_modules/accrual/mcp/server.mjs</text>
    <text x="1100" y="600" fill="#7B8B87">resolved</text>
  </g>

  <text x="96" y="664" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#D8E0DD">Node resolves symlinks for one and not the other, so the only</text>
  <text x="96" y="702" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#D8E0DD">path a real client uses was judged &#8220;imported&#8221;.</text>

  <text x="96" y="762" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" fill="#FFB238">it started, answered nothing, exited 0.</text>

  <rect x="96" y="798" width="1408" height="2" fill="#1E2826"/>

  <text x="96" y="856" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" fill="#7B8B87">found by installing the tarball, not by running the suite. fix: realpathSync.</text>
  <text x="1504" y="856" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" fill="#B8FF3C">accrual</text>
</svg>
